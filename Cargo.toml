[package]
name = "claude-usage-line"
version = "0.1.0"
edition = "2021"

[dependencies]
portable-pty = "0.8"
strip-ansi-escapes = "0.2"
vt100 = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fslock = "0.2"
notify = "6"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
